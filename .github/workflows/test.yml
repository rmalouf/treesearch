name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: lint
      # Use the ruff pinned in uv.lock rather than `uvx ruff`, so a new ruff
      # release cannot fail an unrelated PR. Upgrade deliberately with
      # `uv lock --upgrade-package ruff`.
      - name: Install ruff
        run: uv sync --only-group dev
      - name: ruff check
        run: uv run --no-sync ruff check python tests
      - name: ruff format
        run: uv run --no-sync ruff format --check python tests

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --lib --bins --tests

      - name: cargo test --doc
        run: cargo test --doc

  # The full Python/OS grid runs against the built wheels in pypi.yml.
  python:
    name: Python 3.14 on Linux
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.14'
      # Tests do not need the LTO release build, which dominates CI time.
      MATURIN_PEP517_ARGS: --profile dev
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: test
          python-version: '3.14'
      - name: Build extension and install dependencies
        run: uv sync --group dev
      - name: Run Python tests
        run: uv run --no-sync pytest
