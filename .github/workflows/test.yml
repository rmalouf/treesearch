name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all --check
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # Use the ruff pinned in uv.lock rather than `uvx ruff`, so a new ruff
      # release cannot fail an unrelated PR. Upgrade deliberately with
      # `uv lock --upgrade-package ruff`.
      - name: Install ruff
        run: uv sync --only-group dev
      - name: ruff check
        run: uv run --no-sync ruff check python tests
      - name: ruff format
        run: uv run --no-sync ruff format --check python tests

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --lib --bins --tests

      - name: cargo test --doc
        run: cargo test --doc

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # Build the extension without LTO/codegen-units=1; tests do not need the
      # release profile and the release build dominates CI time.
      MATURIN_PEP517_ARGS: --profile dev
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Build extension and install dependencies
        run: uv sync --group dev
      - name: Run Python tests
        run: uv run pytest
